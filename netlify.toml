# Netlify config for the UFFT site.
# Deploy: drag this `website/` folder onto app.netlify.com/drop,
# or `netlify deploy --dir=. --prod` from inside it. No build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Short alias for the book
[[redirects]]
  from = "/book"
  to = "/foam-unites-us/"
  status = 301
[[redirects]]
  from = "/book/*"
  to = "/foam-unites-us/:splat"
  status = 301
[[redirects]]
  from = "/shape"
  to = "/shape-of-everything/"
  status = 301
